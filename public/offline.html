<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>인터넷 연결 확인 · 여행의 결</title>
    <style>
      body {
        margin: 0;
        padding: 12vh 24px;
        background: #fff;
        color: #142139;
        font:
          17px/1.8 system-ui,
          sans-serif;
      }
      main {
        max-width: 520px;
        margin: auto;
      }
      h1 {
        font-size: 32px;
        line-height: 1.3;
        letter-spacing: -0.03em;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        background: #0754f8;
        color: #fff;
        border-radius: 12px;
        text-decoration: none;
      }
      p {
        color: #526078;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>잠시 연결이 끊겼어요.</h1>
      <p>
        여행의 결을 열거나 AI로 계획하려면 인터넷 연결이 필요합니다. 연결을
        확인한 뒤 다시 열어주세요.
      </p>
      <p>
        미리 다운로드한 HTML 가이드북은 기기의 파일 앱에서 인터넷 없이 열 수
        있습니다. 이 화면에서 브라우저의 여행 기록을 삭제하지는 않습니다.
      </p>
      <a href="/">다시 연결하기</a>
    </main>
  </body>
</html>
